<div id="app"></div>

<script>
/* =========================================================
   1) Firebase設定
   ここに、ご自身のFirebaseプロジェクト（assist-roumu）の
   設定情報を貼り付けてください。
   Firebaseコンソール → プロジェクトの設定 → 全般
   → 「マイアプリ」→ ウェブアプリの設定 から確認できます。
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD1bprw7Xb6ZisnOkRKMlul_iW-rLvzf28",
  authDomain: "assist-roumu.firebaseapp.com",
  projectId: "assist-roumu",
  storageBucket: "assist-roumu.firebasestorage.app",
  messagingSenderId: "919904591114",
  appId: "1:919904591114:web:33d30e66ea4264e081eef3"
};

if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let db = null;
let firebaseReady = false;
let authReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseReady = firebaseConfig.apiKey !== "ここに貼り付け";
  if (firebaseReady) {
    // パートさん用：裏側で匿名認証（画面や操作は変わりません）
    // 管理者用：メールアドレス＋パスワードでFirebase Authenticationにログイン
    firebase.auth().onAuthStateChanged(user => {
      authReady = !!user;
      if (!user) {
        // 誰もログインしていない状態になったら、匿名認証に戻す
        firebase.auth().signInAnonymously().catch(e => console.error("匿名認証エラー", e));
      }
    });
  }
} catch (e) {
  console.error("Firebase初期化エラー", e);
}

/* 現在ログイン中のFirebaseユーザーが管理者かどうかを確認する。
   Firestoreの admins コレクションに、そのユーザーのUIDのドキュメントが
   存在する場合だけ管理者として扱う（コード内にパスワードを持たない）。 */
async function verifyAdminClaim() {
  const user = firebase.auth().currentUser;
  if (!user || user.isAnonymous) return false;
  try {
    const doc = await db.collection("admins").doc(user.uid).get();
    return doc.exists;
  } catch (e) {
    console.error("管理者確認エラー", e);
    return false;
  }
}

/* =========================================================
   2) 有給の比例付与テーブル（労働基準法）
   ========================================================= */
// ブラケット: 6ヶ月, 1年6ヶ月, 2年6ヶ月, 3年6ヶ月, 4年6ヶ月, 5年6ヶ月, 6年6ヶ月以上
const GRANT_TABLE = {
  4: [7, 8, 9, 10, 12, 13, 15],
  3: [5, 6, 6, 8, 9, 10, 11],
  2: [3, 4, 4, 5, 6, 6, 7],
  1: [1, 2, 2, 3, 3, 3, 3],
  5: [10, 11, 12, 14, 16, 18, 20] // 週5日以上（フルタイム相当）
};

function monthsBetween(hireDateStr, now) {
  const hire = new Date(hireDateStr);
  return (now.getFullYear() - hire.getFullYear()) * 12 + (now.getMonth() - hire.getMonth());
}

function calcAnnualGrant(hireDateStr, weeklyDays) {
  if (!hireDateStr || !weeklyDays) return 0;
  const months = monthsBetween(hireDateStr, new Date());
  if (months < 6) return 0;
  // 6ヶ月刻みのブラケット番号（0〜6）
  let bracket = Math.floor((months - 6) / 12) + 1;
  bracket = Math.min(bracket, 7) - 1;
  const table = GRANT_TABLE[weeklyDays] || GRANT_TABLE[4];
  return table[Math.max(0, Math.min(bracket, table.length - 1))];
}

   覚えておいて元に戻す。（他の人からの連絡が届いた拍子に入力が中断されないように） */
function render() {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const canSelect = active && typeof active.selectionStart === "number";
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;

  renderScreen();

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement && typeof el.focus === "function") {
      try {
        el.focus({ preventScroll: true });
        if (selStart !== null && typeof el.setSelectionRange === "function") {
          el.setSelectionRange(selStart, selEnd);
        }
      } catch (e) { /* 数値入力など、対応していない種類は何もしない */ }
    }
  }
}

function waitForAuth(timeoutMs) {
  return new Promise(resolve => {
    if (authReady) return resolve();
    const started = Date.now();
    const iv = setInterval(() => {
      if (authReady || Date.now() - started > timeoutMs) {
        clearInterval(iv);
        resolve();
      }
    }, 100);
  });
}

async function handleStaffLogin() {
  const loginId = document.getElementById("loginId").value.trim();
  const code3 = document.getElementById("loginCode3").value.trim();
  if (!loginId) return alert("ログインIDを入力してください");
  if (!/^\d{3}$/.test(code3)) return alert("従業員コードの下3桁（数字3桁）を入力してください");

  if (!firebaseReady) {
    // Firebase未設定時のダミーユーザー（動作確認用）。デモの従業員コードは "1-0-001" 固定です。
    if (code3 !== "001") return alert("ログインIDまたは従業員コードが正しくありません。");
    saveOrClearLoginId(loginId, code3);
    state.currentUser = { id: "demo1", name: "松崎 貞子", loginId, employeeCode: "1-0-001", role: "staff", area: "大阪エリア", hireDate: "2020-04-01", weeklyDays: 3 };
    state.screen = "staffHome";
    return render();
  }

  await waitForAuth(3000);

  try {
    const snap = await db.collection("employees").where("loginId", "==", loginId).limit(1).get();
    if (snap.empty) return alert("ログインIDまたは従業員コードが正しくありません。");
    const doc = snap.docs[0];
    const empData = doc.data();
    if (last3OfEmployeeCode(empData.employeeCode) !== code3) {
      return alert("ログインIDまたは従業員コードが正しくありません。");
    }
    if (empData.status === "resigned") {
      return alert("このログインIDは現在ご利用いただけません。本社にお問い合わせください。");
    }
    saveOrClearLoginId(loginId, code3);
    state.currentUser = { id: doc.id, role: "staff", ...empData };
    state.screen = "staffHome";
    render();
    // 最終ログイン日時を記録（本社が「ログインできているか」を確認するため）。失敗してもログインは続行。
    try {
      await db.collection("employees").doc(doc.id).update({
        lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) { console.warn("最終ログインの記録をスキップ", e && e.message); }
    subscribeStaffLeaveRequests();
    subscribeStaffOrders();
    subscribeStaffMessages();
    subscribeStaffPayslips();
    subscribeStaffGroups(); // ホーム画面で未読バッジを出すため、ログイン時から購読しておく
  } catch (e) {
    alert("接続エラーが発生しました: " + e.message);
  }
}

async function handleAdminLogin() {
  const email = (document.getElementById("adminEmail").value || "").trim();
  const pass = document.getElementById("adminPass").value;
  if (!email || !pass) return alert("メールアドレスとパスワードを入力してください");

  if (!firebaseReady) {
    // Firebase未設定時の動作確認用
    state.currentUser = { role: "admin", name: "本社担当" };
    state.screen = "adminHome";
    render();
    return;
  }

  try {
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    const isAdmin = await verifyAdminClaim();
    if (!isAdmin) {
      await firebase.auth().signOut();
      return alert("このアカウントには管理者権限がありません。本社にお問い合わせください。");
    }
    saveOrClearAdminEmail(email, pass);
    state.currentUser = { role: "admin", name: cred.user.email };
  } catch (e) {
    const msg = {
      "auth/invalid-email": "メールアドレスの形式が正しくありません",
      "auth/user-not-found": "メールアドレスまたはパスワードが正しくありません",
      "auth/wrong-password": "メールアドレスまたはパスワードが正しくありません",
      "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません",
      "auth/too-many-requests": "試行回数が多すぎます。しばらく待ってからお試しください",
      "auth/network-request-failed": "ネットワークに接続できませんでした"
    }[e.code] || ("ログインできませんでした: " + e.message);
    return alert(msg);
  }
  state.screen = "adminHome";
  render();
  if (firebaseReady) { subscribeAllLeaveRequests(); subscribeAllMessages(); subscribeAllGroups(); }
  subscribeEnvelopeSettings();
}

  const day = now.getDay();       // 0=日, 6=土

  if (day === 0 || day === 6) return false;
  if (hour >= 17) return false;
  return true;
}

let staffOrdersUnsub = [];
function subscribeStaffOrders() {
  if (!firebaseReady) return;
  // 前のログインの購読が残らないよう、いったん解除する
  staffOrdersUnsub.forEach(fn => { try { fn(); } catch (e) {} });
  staffOrdersUnsub = [];

  const me = state.currentUser.id;
  const myWorkplace = (state.currentUser.workplace || "").trim();

  const mineMap = {};  // 自分が出した発注
  const siteMap = {};  // 同じ就業場所（現場）の発注

  const apply = () => {
    // 同僚ぶんを土台にして、自分ぶんで上書き（重複は自分の情報を優先）
    const merged = { ...siteMap, ...mineMap };
    const rows = Object.values(merged);
    rows.sort((a, b) => {
      const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
      const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
      return tb - ta;
    });
    state.orders = rows;
    render();
  };

  // (1) 自分の発注（現場が未登録の人でも必ず自分ぶんは見える）
  staffOrdersUnsub.push(
    db.collection("orders").where("employeeId", "==", me).onSnapshot(snap => {
      Object.keys(mineMap).forEach(k => delete mineMap[k]);
      snap.docs.forEach(d => { mineMap[d.id] = { id: d.id, ...d.data() }; });
      apply();
    }, err => console.error("orders(自分)購読エラー", err))
  );

  // (2) 同じ就業場所の発注（自分に現場が登録されている場合のみ）
  if (myWorkplace) {
    staffOrdersUnsub.push(
      db.collection("orders").where("workplace", "==", myWorkplace).onSnapshot(snap => {
        Object.keys(siteMap).forEach(k => delete siteMap[k]);
        snap.docs.forEach(d => { siteMap[d.id] = { id: d.id, ...d.data() }; });
        apply();
      }, err => console.error("orders(現場)購読エラー", err))
    );
  }
}

function compressImageToBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("画像の読み込みに失敗しました"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}

function generateGroupCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 紛らわしい文字（0/O, 1/I）は除外

}

/* --- グループ一覧の並び替え・未読判定のための共通処理 ---------------- */

// Firestoreのタイムスタンプ・ISO文字列・未設定 のいずれでも「秒」に揃える
function tsSeconds(v) {
  if (!v) return 0;
  if (typeof v === "object" && typeof v.seconds === "number") return v.seconds;
  const t = new Date(v).getTime();
  return isNaN(t) ? 0 : Math.floor(t / 1000);
}

// そのグループの最終更新時刻（メッセージがなければ作成時刻）
function groupLastActivity(g) {
  return tsSeconds(g.lastMessageAt) || tsSeconds(g.createdAt);
}

// 自分にとって未読かどうか
function groupHasUnread(g) {
  const me = state.currentUser && state.currentUser.id;
  if (!me) return false;
  const last = tsSeconds(g.lastMessageAt);
  if (!last) return false;
  if (g.lastMessageBy === me) return false;          // 自分が送ったものは未読にしない
  return last > tsSeconds((g.lastRead || {})[me]);
}

// 「3分前」「昨日」のような、ざっくりした時刻表示
function relativeTimeLabel(seconds) {
  if (!seconds) return "";
  const diff = Math.floor(Date.now() / 1000) - seconds;
  if (diff < 60) return "たった今";
  if (diff < 3600) return Math.floor(diff / 60) + "分前";
  if (diff < 86400) return Math.floor(diff / 3600) + "時間前";
  if (diff < 172800) return "昨日";
  const d = new Date(seconds * 1000);
  return (d.getMonth() + 1) + "/" + d.getDate();
}

      ["lastRead." + me]: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    console.error("既読の記録に失敗", e);
  }
}

  markGroupRead(groupId);
}

function subscribeGroupMessages(groupId) {
  if (!firebaseReady) {
    state.groupMessages = state.groupMessages || [];
    return render();
  }
  db.collection("groupMessages")
    .where("groupId", "==", groupId)
    .onSnapshot(snap => {
      const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rows.sort((a, b) => {
        const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
        return ta - tb;
      });
      state.groupMessages = rows;
      // このグループを開いている間に届いたものは、その場で既読にする
      if (state.groupScreen === "chat" && state.activeGroupId === groupId) markGroupRead(groupId);
      render();
    }, err => console.error("groupMessages購読エラー", err));
}

async function leaveGroup(groupId) {
  if (!confirm("このグループから抜けます。よろしいですか？")) return;

  if (!firebaseReady) {
    state.groupChats = (state.groupChats || []).filter(g => g.id !== groupId);
    state.groupScreen = "list";
    state.activeGroupId = null;
    return render();
  }
  try {
    const doc = await db.collection("groupChats").doc(groupId).get();
    const g = doc.data() || {};
    const remaining = (g.members || []).filter(m => m !== state.currentUser.id);
    if (remaining.length === 0) {
      await deleteGroupAndMessages(groupId);
    } else {
      await db.collection("groupChats").doc(groupId).update({
        members: firebase.firestore.FieldValue.arrayRemove(state.currentUser.id)
      });
    }
    state.groupScreen = "list";
    state.activeGroupId = null;
    render();
  } catch (e) {
    alert("退出エラー: " + e.message);
  }
}

async function handleGroupPhotoSelect(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  if (file.size > 15 * 1024 * 1024) { alert("写真のサイズが大きすぎます"); return; }
  try {
    const base64 = await compressImageToBase64(file, 700, 0.55);
    if (base64.length > 900000) {
      alert("写真を圧縮しましたが、まだ少し大きいようです。別の写真でお試しください。");
      return;
    }
    state.groupPendingPhoto = { base64 };
    render();
  } catch (e) {
    alert("写真の読み込みに失敗しました: " + e.message);
  }
}

async function sendGroupMessage() {
  const text = document.getElementById("groupChatTextInput").value.trim();
  if (!text && !state.groupPendingPhoto) return alert("メッセージか写真を入力してください");

  const photoURL = state.groupPendingPhoto ? state.groupPendingPhoto.base64 : null;
  const data = {
    groupId: state.activeGroupId,
    employeeId: state.currentUser.id,
    senderName: state.currentUser.name || "",
    text, photoURL,
    createdAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
  };

  if (!firebaseReady) {
    state.groupMessages = state.groupMessages || [];
    state.groupMessages.push({ ...data, id: "demo-" + Date.now() });
    const g = (state.groupChats || []).find(x => x.id === state.activeGroupId);
    if (g) {
      g.lastMessageAt = new Date().toISOString();
      g.lastMessageText = text || "写真を送りました";
      g.lastMessageBy = state.currentUser.id;
      g.lastMessageByName = state.currentUser.name || "";
    }
    state.groupPendingPhoto = null;
    document.getElementById("groupChatTextInput").value = "";
    return render();
  }
  try {
    await db.collection("groupMessages").add(data);
    // 一覧の並び替え・未読判定に使う情報を、グループ側にも残しておく
    await db.collection("groupChats").doc(state.activeGroupId).update({
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessageText: (text || "写真を送りました").slice(0, 40),
      lastMessageBy: state.currentUser.id,
      lastMessageByName: state.currentUser.name || "",
      ["lastRead." + state.currentUser.id]: firebase.firestore.FieldValue.serverTimestamp()
    });
    state.groupPendingPhoto = null;
    render();
  } catch (e) {
    alert("送信エラー: " + e.message);
  }
}

async function submitLeaveRequest() {
  const date = document.getElementById("leaveDate").value;
  const type = document.getElementById("leaveType").value;
  const reason = document.getElementById("leaveReason").value;
  if (!date) return alert("日付を選んでください");

  if (type === "有給休暇") {
    const today = new Date();
    const minDate = new Date(today); minDate.setDate(minDate.getDate() + 14);
    const maxDate = new Date(today); maxDate.setMonth(maxDate.getMonth() + 1);
    const picked = new Date(date);
    if (picked < minDate || picked > maxDate) {
      return alert("有給休暇の申請は2週間後から1か月後までの日付でお願いします");
    }
  }

  const data = {
    employeeId: state.currentUser.id,
    employeeName: state.currentUser.name,
    area: state.currentUser.area || "",
    date, type, reason,
    status: "pending",
    createdAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
  };

  if (!firebaseReady) {
    state.leaveRequests.unshift({ ...data, id: "demo-" + Date.now() });
    state.screen = "staffHome";
    state.leaveFormType = null; state.leaveFormReason = ""; state.leaveFormDate = "";
    return render();
  }

  try {
    await db.collection("leaveRequests").add(data);
    state.screen = "staffHome";
    state.leaveFormType = null; state.leaveFormReason = ""; state.leaveFormDate = "";
    render();
  } catch (e) {
    alert("送信エラー: " + e.message);
  }
}

// パートさんが自分の休み申請について「日にちをまちがえたので取り消したい」と本社にお願いする。
// ここでは取り消しを確定せず、状態を「取り消し依頼中(cancelRequested)」にして本社に届ける。
async function requestCancelLeave(id) {
  const r = (state.leaveRequests || []).find(x => x.id === id);
  if (!r) return;
  if (r.employeeId !== state.currentUser.id) return; // 自分の申請だけお願いできる
  if (r.status !== "pending") {
    return alert("この申請はすでに本社が確認したため、アプリからは取り消しをお願いできません。お手数ですが本社（06-6654-7812）にお電話ください。");
  }
  if (!confirm(`${r.date}（${r.type}）の申請について、取り消しを本社にお願いします。よろしいですか？\n\n本社が確認すると取り消しが確定します。そのあと、正しい日にちであらためて申請してください。`)) return;
  if (!firebaseReady) {
    r.status = "cancelRequested";
    r.cancelRequestedAt = new Date().toISOString();
    r.cancelRequestedBy = state.currentUser.name || "";
    return render();
  }
  try {
    await db.collection("leaveRequests").doc(id).update({
      status: "cancelRequested",
      cancelRequestedAt: firebase.firestore.FieldValue.serverTimestamp(),
      cancelRequestedBy: state.currentUser.name || ""
    });
  } catch (e) {
    alert("取り消しのお願いを送れませんでした: " + e.message);
  }
}

// 本社が取り消し依頼を「承認」して取り消しを確定する
async function approveCancelLeave(id) {
  const r = (state.leaveRequests || []).find(x => x.id === id);
  if (!r) return;
  if (!confirm(`${r.employeeName || ""}さんの ${r.date}（${r.type}）の申請を取り消します。よろしいですか？`)) return;
  if (!firebaseReady) {
    r.status = "cancelled";
    r.cancelledAt = new Date().toISOString();
    r.cancelledBy = "本社";
    return render();
  }
  try {
    await db.collection("leaveRequests").doc(id).update({
      status: "cancelled",
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      cancelledBy: "本社"
    });
  } catch (e) {
    alert("更新エラー: " + e.message);
  }
}

// 本社が取り消し依頼を「戻す」＝取り消しをやめて、元の確認中(pending)に戻す
async function denyCancelLeave(id) {
  const r = (state.leaveRequests || []).find(x => x.id === id);
  if (!r) return;
  if (!confirm(`${r.employeeName || ""}さんの ${r.date}（${r.type}）の取り消し依頼を取り下げ、「確認中」に戻します。よろしいですか？`)) return;
  if (!firebaseReady) {
    r.status = "pending";
    return render();
  }
  try {
    await db.collection("leaveRequests").doc(id).update({ status: "pending" });
  } catch (e) {
    alert("更新エラー: " + e.message);
  }
}

/* 「受け取り完了ぶん」を、直近3週間と、それより前とに分けるための共通処理 */
const DONE_RECENT_DAYS = 21; // 3週間

// 受け取り完了日が直近3週間以内かどうか。
// 完了日が記録されていない古い記録は、「3週間より前」のほうに入れる。
function isRecentDone(o) {
  const sec = tsSeconds(o.receivedAt);
  if (!sec) return false;
  return (Date.now() / 1000 - sec) <= DONE_RECENT_DAYS * 86400;
}

// scope は "recent"（直近3週間）か "old"（3週間より前）
function doneOrderSearchValue(scope) {
  return (scope === "old" ? state.oldDoneOrderSearch : state.doneOrderSearch) || "";
}

function filterDoneOrders(scope) {
  const done = (state.orders || []).filter(o => o.status === "received");
  const list = done
    .filter(o => scope === "old" ? !isRecentDone(o) : isRecentDone(o))
    .slice()
    .sort((a, b) => tsSeconds(b.receivedAt) - tsSeconds(a.receivedAt)); // 完了日の新しい順
  const q = doneOrderSearchValue(scope).trim().toLowerCase();
  if (!q) return list;
  return list.filter(o =>
    [o.item, o.place, o.employeeName, o.area].some(f => (f || "").toLowerCase().includes(q))
  );
}

// 完了ぶんの一覧本体（完了日つき）を描く
function renderDoneOrderList(isNarrow, statusOptions, scope) {
  const list = filterDoneOrders(scope);
  if (!list.length) {
    return `<p class="muted" style="font-size:12px; margin:12px 0 0;">${doneOrderSearchValue(scope).trim() ? "見つかりませんでした" : "該当する発注はありません"}</p>`;
  }
  return `<p class="muted" style="font-size:12px; margin:12px 0 4px;">${list.length}件</p>` + (isNarrow
    ? `<div>${list.map(o => renderAdminOrderCard(o, statusOptions)).join("")}</div>`
    : `<table>
        <thead><tr><th>申請者</th><th>場所</th><th>品目</th><th>数量</th><th>注文日</th><th>完了日</th><th>状態</th><th>処理者</th><th></th></tr></thead>
        <tbody>${list.map(o => renderAdminOrderRow(o, statusOptions, true)).join("")}</tbody>
      </table>`);
}

// 検索入力：入力欄を作り直さず、一覧部分だけ差し替える（日本語変換中は反応しない）
function handleDoneOrderSearch(el, scope) {
  if (el.dataset.composing === "1") return;
  const which = scope === "old" ? "old" : "recent";
  if (which === "old") state.oldDoneOrderSearch = el.value;
  else state.doneOrderSearch = el.value;
  const body = document.getElementById(which === "old" ? "oldDoneOrderListBody" : "doneOrderListBody");
  if (!body) return;
  const isNarrow = window.innerWidth <= 700;
  const statusOptions = [
    ["pending", "未確認"], ["arranging", "手配中"], ["ordered", "発注済み"],
    ["arrived", "到着済み"], ["received", "受け取り完了"], ["cancelled", "取り消し"]
  ];
  body.innerHTML = renderDoneOrderList(isNarrow, statusOptions, which);
}

// 受け取り完了ぶんをエクセル（.xlsx）に書き出す。
// 検索欄に文字が入っているときは、その絞り込み結果だけを書き出す。
function exportDoneOrdersToExcel(scope) {
  const list = filterDoneOrders(scope);
  if (!list.length) return alert("書き出すデータがありません");
  const statusLabel = { pending: "未確認", arranging: "手配中", ordered: "発注済み", arrived: "到着済み", received: "受け取り完了", cancelled: "取り消し" };
  const rows = list.map(o => ({
    "申請者": o.employeeName || "",
    "エリア": o.area || "",
    "発注場所": o.place || "",
    "品目": o.item || "",
    "数量": o.qty || "",
    "注文日": fmtYmd(o.createdAt),
    "完了日": fmtYmd(o.receivedAt),
    "状態": statusLabel[o.status] || o.status || "",
    "処理者": o.handledBy || "",
    "電話注文": o.byPhone ? "はい" : ""
  }));
  const sheetName = scope === "old" ? "3週間より前" : "直近3週間";
  try {
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `発注リスト_受け取り完了_${sheetName}_${dateStr}.xlsx`);
  } catch (e) {
    alert("書き出しに失敗しました: " + e.message);
  }
}

async function submitPhoneOrder() {
  // 入力欄が画面にあればそこから、なければ保存済みの下書きから読む
  const readField = (id, key) => {
    const el = document.getElementById(id);
    return ((el ? el.value : state[key]) || "").toString().trim();
  };

  const name = readField("phoneOrderName", "phoneOrderName");
  const place = readField("phoneOrderPlace", "phoneOrderPlace");
  let item = state.phoneOrderItem || ITEM_MASTER[0];
  if (item === "__free__") {
    item = readField("phoneOrderFreeText", "phoneOrderFreeText");
    if (!item) return alert("品目を書いてください");
  }
  const qty = parseInt(readField("phoneOrderQty", "phoneOrderQty"), 10) || 1;
  if (!name) return alert("申請者名を入れてください");
  if (!place) return alert("発注する場所を入れてください");

  // 登録が終わったら下書きを消す
  const clearDraft = () => {
    state.showPhoneOrderForm = false;
    state.phoneOrderItem = null;
    state.phoneOrderName = "";
    state.phoneOrderPlace = "";
    state.phoneOrderFreeText = "";
    state.phoneOrderQty = 1;
  };

  const data = {
    employeeId: "phone-" + Date.now(),
    employeeName: name,
    area: "",
    place, item, qty,
    status: "pending",
    byPhone: true,
    handledBy: state.currentUser.name || "本社担当",
    createdAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
  };

  if (!firebaseReady) {
    state.orders = state.orders || [];
    state.orders.unshift({ ...data, id: "demo-" + Date.now() });
    clearDraft();
    return render();
  }
  try {
    await db.collection("orders").add(data);
    clearDraft();
    render();
  } catch (e) {
    alert("登録エラー: " + e.message);
  }
}

/* 処理者はメールアドレスがそのまま入るため、@より前だけを短く表示する */
function shortHandler(v) {
  const t = (v || "").trim();
  if (!t) return "-";
  const head = t.includes("@") ? t.split("@")[0] : t;
  return head.length > 12 ? head.slice(0, 12) + "…" : head;
}

/* --- 修正用のダイアログ（スマホでも押しやすいよう、大きめの入力欄にする） --- */
function renderOrderEditModal() {
  if (!state.editingOrderId) return "";
  const o = (state.orders || []).find(x => x.id === state.editingOrderId);
  if (!o) return "";

  // iPhoneのSafariは文字が16px未満だと勝手に拡大してしまうので、16pxにする
  const fieldStyle = "font-size:16px; padding:13px; margin:0; width:100%;";

  return `
    <div class="modal-overlay" onclick="cancelEditOrder()">
      <div class="modal-box" style="max-width:460px;" onclick="event.stopPropagation()">
        <div class="row-between" style="margin-bottom:4px;">
          <p class="staff-title" style="font-size:17px; margin:0;">発注をなおす</p>
          <button class="link" style="font-size:20px; padding:0; line-height:1;" onclick="cancelEditOrder()" title="とじる">×</button>
        </div>

        <label style="margin:14px 0 5px;">発注する場所</label>
        <input id="orderEditPlace" type="text" style="${fieldStyle}" value="${escapeHtml(state.orderEditPlace || "")}" oninput="state.orderEditPlace=this.value;" />

        <label style="margin:14px 0 5px;">品目</label>
        <input id="orderEditItem" type="text" style="${fieldStyle}" value="${escapeHtml(state.orderEditItem || "")}" oninput="state.orderEditItem=this.value;" />
        <div class="preset-row" style="margin-top:8px;">
          ${ITEM_MASTER.map(it => `<button type="button" class="preset-btn" onclick="setOrderEditItem('${escapeHtml(it)}')">${escapeHtml(it)}</button>`).join("")}
        </div>

        <label style="margin:14px 0 5px;">数量</label>
        <div style="display:flex; align-items:center; gap:16px;">
          <button type="button" style="width:52px; height:52px; font-size:26px; padding:0;" onclick="changeOrderEditQty(-1)">－</button>
          <span id="orderEditQtyView" style="font-size:26px; font-weight:700; min-width:44px; text-align:center;">${state.orderEditQty || 1}</span>
          <button type="button" style="width:52px; height:52px; font-size:26px; padding:0;" onclick="changeOrderEditQty(1)">＋</button>
        </div>

        <button class="primary" style="margin-top:20px; padding:14px; font-size:16px;" onclick="saveOrderEdit('${o.id}')">この内容で保存する</button>

        <button class="link" style="margin-top:14px; font-size:13px; color:var(--danger);" onclick="deleteOrder('${o.id}')">この発注を消す</button>

}

function setOrderEditItem(item) {
  state.orderEditItem = item;
  const el = document.getElementById("orderEditItem");
  if (el) el.value = item;
}

function changeOrderEditQty(d) {
  state.orderEditQty = Math.max(1, (parseInt(state.orderEditQty, 10) || 1) + d);
  const el = document.getElementById("orderEditQtyView");
  if (el) el.textContent = state.orderEditQty;
}

function startEditOrder(id) {
  const o = (state.orders || []).find(x => x.id === id);
  if (!o) return alert("この発注が見つかりませんでした");
  state.editingOrderId = id;
  state.orderEditName = o.employeeName || "";
  state.orderEditPlace = o.place || "";
  state.orderEditItem = o.item || "";
  state.orderEditQty = o.qty || 1;
  render();
}

function cancelEditOrder() {
  state.editingOrderId = null;
  state.orderEditName = "";
  state.orderEditPlace = "";
  state.orderEditItem = "";
  state.orderEditQty = 1;
  render();
}

async function saveOrderEdit(id) {
  const name = (state.orderEditName || "").trim();
  const place = (state.orderEditPlace || "").trim();
  const item = (state.orderEditItem || "").trim();
  const qty = parseInt(state.orderEditQty, 10) || 1;

  if (!name) return alert("申請者名を入れてください");
  if (!place) return alert("発注する場所を入れてください");
  if (!item) return alert("品目を入れてください");

  const patch = {
    employeeName: name,
    place,
    item,
    qty,
    handledBy: (state.currentUser && state.currentUser.name) || "本社担当"
  };

  if (!firebaseReady) {
    const o = (state.orders || []).find(x => x.id === id);
    if (o) Object.assign(o, patch);
    return cancelEditOrder();
  }
  try {
    await db.collection("orders").doc(id).update(patch);
    cancelEditOrder();
  } catch (e) {
    alert("保存できませんでした: " + e.message);
  }
}

async function deleteOrder(id) {
  const o = (state.orders || []).find(x => x.id === id);
  if (!o) return alert("この発注が見つかりませんでした");

  const label = `${o.employeeName || "(申請者なし)"}／${o.place || "(場所なし)"}／${o.item || ""} ${o.qty}`;
  if (!confirm(`次の発注を削除します。\n\n${label}\n\nこの操作は元に戻せません。よろしいですか？`)) return;

  if (!firebaseReady) {
    state.orders = (state.orders || []).filter(x => x.id !== id);
    if (state.editingOrderId === id) state.editingOrderId = null;
    return render();
  }
  try {
    await db.collection("orders").doc(id).delete();
    if (state.editingOrderId === id) cancelEditOrder();
  } catch (e) {
    if (e.code === "permission-denied") {
      alert("削除する権限がありませんでした。管理者としてログインしているかご確認ください。");
    } else {
      alert("削除できませんでした: " + e.message);
    }
  }
}

async function updateOrderStatus(id, status) {
  const handler = state.currentUser.name || "本社担当";
  const cur = (state.orders || []).find(x => x.id === id);
  // 初めて「受け取り完了」にした時だけ完了日を記録（すでに記録済みなら上書きしない）
  const needReceivedAt = status === "received" && !(cur && cur.receivedAt);
  if (!firebaseReady) {
    const o = state.orders.find(x => x.id === id);
    if (o) { o.status = status; o.handledBy = handler; if (needReceivedAt) o.receivedAt = new Date().toISOString(); }
    return render();
  }
  try {
    const patch = { status, handledBy: handler };
    if (needReceivedAt) patch.receivedAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("orders").doc(id).update(patch);
  } catch (e) {
    alert("更新エラー: " + e.message);
  }
}

// 「YYYY-MM-DD」の日付を「8月15日（金）」＋あと何日か、に整える
function leaveDateLabel(dateStr) {
  const d = parseFlexibleDate(dateStr);
  if (!d || isNaN(d)) return { label: dateStr || "", urgency: "", soon: false };
  const wd = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
  const label = `${d.getMonth() + 1}月${d.getDate()}日（${wd}）`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  d.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 86400000);
  let urgency = "";
  if (days === 0) urgency = "今日";
  else if (days === 1) urgency = "明日";
  else if (days <= 7) urgency = `あと${days}日`;
  return { label, urgency, soon: days <= 1 };
}

// 曜日ごとの勤務時間から「月・水・金」のような一覧表示用サマリーを作る（未入力時は旧shiftDaysにフォールバック）
function shiftSummary(e) {

// 曜日ごとの勤務時間から「週の勤務日数」「就業時間」「休日」を自動計算する
function computeShiftDerivedFields(emp) {
  const filled = WEEKDAY_FIELDS.map(([key, label]) => [label, (emp[key] || "").trim()]).filter(([, v]) => v);
  const weeklyDays = filled.length;
  const groups = [];
  filled.forEach(([label, time]) => {
    const g = groups.find(g => g.time === time);
    if (g) g.labels.push(label); else groups.push({ time, labels: [label] });
  });
  const workHours = groups.map(g => `${g.labels.join("・")} ${g.time}`).join("、");
  const offLabels = WEEKDAY_FIELDS.map(([key, label]) => [label, (emp[key] || "").trim()]).filter(([, v]) => !v).map(([label]) => label);
  const holiday = offLabels.join("・");
  return { weeklyDays, workHours, holiday };
}

// 「1990-05-01」のような西暦だけでなく、「昭和24年9月13日」のような和暦入力も読み取れるようにする
const WAREKI_ERA_START = { "明治": 1868, "大正": 1912, "昭和": 1926, "平成": 1989, "令和": 2019 };
function parseFlexibleDate(str) {
  if (!str) return null;
  const s = str.toString().trim();

  // 和暦（例：昭和24年9月13日 / 令和元年5月1日 / 平成 3 年 5 月 1 日）
  const warekiMatch = s.match(/(明治|大正|昭和|平成|令和)\s*(元|\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/);
  if (warekiMatch) {
    const [, era, eraYearRaw, monthStr, dayStr] = warekiMatch;
    const eraYear = eraYearRaw === "元" ? 1 : parseInt(eraYearRaw, 10);
    const gregorianYear = WAREKI_ERA_START[era] + eraYear - 1;
    const d = new Date(gregorianYear, parseInt(monthStr, 10) - 1, parseInt(dayStr, 10));
    if (!isNaN(d)) return d;
  }

  // 西暦を漢字で書いた形式（例：1959年5月22日）
  const kanjiMatch = s.match(/^(\d{3,4})\s*年\s*(\d+)\s*月\s*(\d+)\s*日/);
  if (kanjiMatch) {
    const [, yearStr, monthStr, dayStr] = kanjiMatch;
    const d = new Date(parseInt(yearStr, 10), parseInt(monthStr, 10) - 1, parseInt(dayStr, 10));
    if (!isNaN(d)) return d;
  }

  // 西暦の数字だけの形式（2026-7-7 / 2026/07/07 / 2026.7.7 など）。
  // iOSのSafariはゼロ埋めされていない日付文字列を読めないため、数値に分解して確実に組み立てる。
  const ymd = s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if (ymd) {
    const d = new Date(parseInt(ymd[1], 10), parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
    if (!isNaN(d)) return d;
  }

  // 上記以外で、Dateがそのまま解釈できる形式
  const d2 = new Date(s);
  if (!isNaN(d2)) return d2;

  return null;
}

function calcAge(birthDateStr) {
  if (!birthDateStr) return null;
  const b = parseFlexibleDate(birthDateStr);
  if (!b || isNaN(b)) return null;
  const today = new Date();
  let age = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
  return age;
}

// 試用期間の終了日を求める：手入力の「試用期間終了日」があればそれを、無ければ「入社日＋1か月」を使う
function probationEndFor(e) {
  if (e && e.probationEnd) return e.probationEnd;
  if (e && e.hireDate) return addMonths(e.hireDate, 1);
  return "";
}
// 今日がまだ試用期間の終了日以前かどうか（＝試用期間中か）
function isInProbation(e) {
  if (!e || e.status === "resigned") return false;
  const end = probationEndFor(e);
  if (!end) return false;
  const endD = parseFlexibleDate(end);
  if (!endD || isNaN(endD)) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  endD.setHours(0, 0, 0, 0);
  return today <= endD;
}
// Firestoreの時刻・ISO文字列・Date のいずれでも「YYYY-MM-DD」に整える（無ければ空文字）
function fmtYmd(ts) {
  if (!ts) return "";
  let d;
  if (ts.seconds) d = new Date(ts.seconds * 1000);
  else if (ts instanceof Date) d = ts;
  else if (typeof ts === "string") d = new Date(ts);
  else return "";
  if (isNaN(d)) return "";
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// 郵便番号と住所が「560-0041 豊中市…」のように結合されている旧データを表示用に分割する
function splitAddressForDisplay(editing) {
  let postalCode = editing.postalCode || "";
  let address = editing.address || "";
  if (!postalCode) {
    const m = address.match(/^(\d{3}-?\d{4})\s+(.*)$/);
    if (m) { postalCode = m[1]; address = m[2]; }
  }
  return { postalCode, address };
}

async function lookupPostalCode() {
  const zipEl = document.getElementById("emp_postalCode");

  if (raw.length !== 7) { alert("郵便番号は7桁の数字で入力してください"); return; }
  try {

/* 有給の消化日数を集計する。
   「有給休暇」だけを対象にし、否決されたものは数えない。
   days が入っていない古い記録は 1日として扱う（半休は 0.5）。 */
function usedPaidLeaveFor(empId) {
  return (state.leaveRequests || [])
    .filter(r => r.employeeId === empId && r.type === "有給休暇" && r.status !== "rejected" && r.status !== "cancelled")
    .reduce((sum, r) => sum + (typeof r.days === "number" ? r.days : 1), 0);
}

/* 有給の残高を「前年からの繰越」も含めて計算する。
   ・法律どおり、有給は付与から2年で時効。よって今もっている有給は
     「今年の付与」＋「前年の付与のうち使い残したぶん（＝繰越）」だけ。
     2年より前に付与されたぶんは時効で消滅するので数えない。
   ・付与日は「入社日＋6か月」から1年ごと。
   ・消化は「有給休暇」で否決でないものを、付与日を境に前年ぶん／今年ぶんに振り分ける。
   返り値: { grantNow, grantPrev, carryOver, usedPrev, usedCurr, remaining, hasData, notYet } */
function leaveBalance(emp) {
  const empty = { grantNow: 0, grantPrev: 0, carryOver: 0, usedPrev: 0, usedCurr: 0, remaining: 0, hasData: false, notYet: false };
  if (!emp || !emp.hireDate || !emp.weeklyDays) return empty;
  const months = monthsBetween(emp.hireDate, new Date());
  if (months < 6) return { ...empty, hasData: true, notYet: true }; // まだ初回付与前（6か月未満）

  const table = GRANT_TABLE[emp.weeklyDays] || GRANT_TABLE[4];
  const grantAt = (k) => table[Math.max(0, Math.min(Math.min(k, 7) - 1, table.length - 1))];
  const k = Math.floor((months - 6) / 12) + 1; // 何回目の付与か（1回目, 2回目, …）
  const grantNow = grantAt(k);
  const grantPrev = k >= 2 ? grantAt(k - 1) : 0;
  const lastGrantDate = addMonths(emp.hireDate, 6 + (k - 1) * 12);
  const prevGrantDate = k >= 2 ? addMonths(emp.hireDate, 6 + (k - 2) * 12) : "";

  const paid = (state.leaveRequests || []).filter(r =>
    r.employeeId === emp.id && r.type === "有給休暇" && r.status !== "rejected" && r.status !== "cancelled");
  const dayOf = r => (typeof r.days === "number" ? r.days : 1);
  let usedPrev = 0, usedCurr = 0;
  paid.forEach(r => {
    const d = r.date || "";
    if (d && d >= lastGrantDate) usedCurr += dayOf(r);                                  // 今年ぶんの消化
    else if (prevGrantDate && d >= prevGrantDate && d < lastGrantDate) usedPrev += dayOf(r); // 前年ぶんの消化
    // prevGrantDate より前の消化は、時効で消えた付与に対応するので数えない
  });

  const carryOver = Math.max(0, Math.min(grantPrev - usedPrev, grantPrev)); // 繰越は前年の付与が上限
  const remaining = Math.max(0, carryOver + grantNow - usedCurr);
  const r1 = n => Math.round(n * 10) / 10;
  return {
    grantNow: r1(grantNow), grantPrev: r1(grantPrev), carryOver: r1(carryOver),
    usedPrev: r1(usedPrev), usedCurr: r1(usedCurr), remaining: r1(remaining),
    hasData: true, notYet: false
  };
}

function remainingLeaveFor(emp) {
  return leaveBalance(emp).remaining;
}

/* 会社側から過去の休み・有給を登録する（管理者のみ） */
async function addAdminLeaveRecord(empId) {
  const emp = (state.employees || []).find(e => e.id === empId);
  if (!emp) return alert("従業員が見つかりませんでした");

  const date = (document.getElementById("admLeaveDate_" + empId) || {}).value || "";
  const type = (document.getElementById("admLeaveType_" + empId) || {}).value || LEAVE_TYPES[0];
  const daysRaw = (document.getElementById("admLeaveDays_" + empId) || {}).value || "1";
  const reason = ((document.getElementById("admLeaveReason_" + empId) || {}).value || "").trim();

  if (!date) return alert("日付を選んでください");

  const days = type === "有給休暇" ? parseFloat(daysRaw) : 0;

  // 同じ日に同じ区分の記録がないか確認する（二重登録の防止）
  const dup = (state.leaveRequests || []).find(
    r => r.employeeId === empId && r.date === date && r.type === type && r.status !== "rejected" && r.status !== "cancelled"
  );
  if (dup && !confirm(`${date} の「${type}」はすでに登録されています。それでも追加しますか？`)) return;

  if (type === "有給休暇") {
    const remaining = remainingLeaveFor(emp);
    if (days > remaining && !confirm(`残り有給は ${remaining}日 です。${days}日を登録すると残日数を超えます。それでも登録しますか？`)) return;
  }

  const data = {
    employeeId: empId,
    employeeName: emp.name || "",
    area: emp.area || "",
    date,
    type,
    reason,
    days,
    status: "approved",
    enteredBy: "admin",
    createdAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
  };

  if (!firebaseReady) {
    state.leaveRequests.unshift({ ...data, id: "demo-" + Date.now() });
    return render();
  }

  try {
    await db.collection("leaveRequests").add(data);
    const r = document.getElementById("admLeaveReason_" + empId);
    if (r) r.value = "";
    render();
  } catch (e) {
    alert("登録できませんでした: " + e.message);
  }
}

/* 記録を削除する（管理者のみ。セキュリティルール側でも管理者に限定しています） */
async function deleteLeaveRecord(id, dateLabel) {
  if (!confirm(`${dateLabel} の記録を削除します。よろしいですか？\nこの操作は元に戻せません。`)) return;

  if (!firebaseReady) {
    state.leaveRequests = state.leaveRequests.filter(r => r.id !== id);
    return render();
  }

  try {
    await db.collection("leaveRequests").doc(id).delete();
    render();
  } catch (e) {
    alert("削除できませんでした: " + e.message);
  }
}

function exportEmployeesToExcel() {
  const list = computeEmpList();
  if (!list.length) return alert("書き出すデータがありません");

  const rows = list.map(e => {

    EMP_FIELDS.forEach(([key, label]) => {
      row[label] = e[key] ?? "";
    });
    row["満年齢"] = calcAge(e.birthDate) ?? "";
    row["在籍状況"] = e.status === "resigned" ? "退職済み" : "在籍中";
    return row;
  });

  try {

    const wb = XLSX.utils.book_new();
    const sheetName = state.showResignedList ? "退職者" : "従業員一覧";

function computeEmpList() {
  const searchVal = state.empSearchVal || "";
  const areaFilter = state.empAreaFilter || "";
  const showResigned = !!state.showResignedList;
  const sortKey = state.empSortKey || "code";

  const source = state.employees.filter(e => showResigned ? e.status === "resigned" : e.status !== "resigned");
  const matchesSearch = e => {
    if (!searchVal) return true;
    const v = searchVal.toLowerCase();
    const vDigits = searchVal.replace(/[^\d]/g, "");
    const phoneDigits = (e.phone || "").replace(/[^\d]/g, "");
    const phoneMatches = vDigits && phoneDigits.includes(vDigits);
    return phoneMatches || [e.name, e.furigana, e.employeeCode, e.phone, e.workplace].some(f => (f || "").toLowerCase().includes(v));
  };
  let list = source.filter(e => matchesSearch(e) && (!areaFilter || e.area === areaFilter));
  list = list.slice().sort((a, b) => {
    if (sortKey === "name") return (a.name || "").localeCompare(b.name || "", "ja");
    if (sortKey === "age") {
      const ageA = calcAge(a.birthDate), ageB = calcAge(b.birthDate);
      if (ageA === null && ageB === null) return 0;
      if (ageA === null) return 1;
      if (ageB === null) return -1;
      return ageB - ageA; // 年上が先
    }
    if (sortKey === "hire") {
      const dir = (state.empHireDir === "asc") ? 1 : -1; // 既定は降順（新しい入社日が上）
      const dA = parseFlexibleDate(a.hireDate), dB = parseFlexibleDate(b.hireDate);
      const tA = (dA && !isNaN(dA)) ? dA.getTime() : null;
      const tB = (dB && !isNaN(dB)) ? dB.getTime() : null;
      if (tA === null && tB === null) return 0;
      if (tA === null) return 1;  // 入社日が未入力の人は常に末尾
      if (tB === null) return -1;
      return (tA - tB) * dir;
    }
    return (a.employeeCode || "").localeCompare(b.employeeCode || "", "ja", { numeric: true });
  });
  return list;
}

  const activeEmps = state.employees.filter(e => e.status !== "resigned");
  const notLoggedCount = activeEmps.filter(e => !e.lastLoginAt).length;
  const loginSummary = showResigned ? "" : `　／　<span style="color:var(--danger); font-weight:700;">まだログインしていない人 ${notLoggedCount}名</span>`;

    return `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 6px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="state.editingEmpId='${e.id}'; render();">

          ${!e.employeeCode ? `<span style="color:var(--danger); font-weight:600; font-size:12px;">⚠️未設定</span>` : ""}
        </div>
        <div class="muted" style="font-size:12px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${metaParts.join(" ・ ")}</div>

async function resignEmployee(id) {
  const dateEl = document.getElementById(`resignDate_${id}`);
  const resignedDate = dateEl ? dateEl.value : "";
  if (!resignedDate) return alert("退職日を選んでください");
  if (!confirm(`退職日を ${resignedDate} として、この方を「退職」扱いにします。ログインIDは自動的に無効化され、ログインできなくなります。\nまた、参加しているグループチャットからも自動的に抜けます。よろしいですか？`)) return;
  const emp = state.employees.find(e => e.id === id) || {};
  const data = {
    status: "resigned",
    resignedDate,
    formerLoginId: emp.loginId || "",
    loginId: ""
  };
  if (!firebaseReady) {
    const idx = state.employees.findIndex(e => e.id === id);
    if (idx >= 0) state.employees[idx] = { ...state.employees[idx], ...data };
    return render();
  }
  try {
    await db.collection("employees").doc(id).update(data);
    await removeMemberFromAllGroups(id);
  } catch (e) {
    alert("更新エラー: " + e.message);
  }
}

// 退職・削除された従業員を、参加中のすべてのグループチャットから抜けさせる。
// 抜けた結果メンバーが0人になったグループは、メッセージごと削除する。
async function removeMemberFromAllGroups(employeeId) {
  if (!firebaseReady) return;
  try {
    const snap = await db.collection("groupChats").where("members", "array-contains", employeeId).get();
    for (const doc of snap.docs) {
      const g = doc.data();
      const remaining = (g.members || []).filter(m => m !== employeeId);
      if (remaining.length === 0) {
        await deleteGroupAndMessages(doc.id);
      } else {
        await db.collection("groupChats").doc(doc.id).update({ members: remaining });
      }
    }
  } catch (e) {
    console.error("グループからの自動退出エラー", e);
  }
}

async function deleteGroupAndMessages(groupId) {
  const msgSnap = await db.collection("groupMessages").where("groupId", "==", groupId).get();
  const batch = db.batch();
  msgSnap.docs.forEach(d => batch.delete(d.ref));
  batch.delete(db.collection("groupChats").doc(groupId));
  await batch.commit();
}

function generateLoginId() {
  const existing = new Set((state.employees || []).map(e => e.loginId).filter(Boolean));
  let id;
  do {

  } while (existing.has(id));
  return id;
}

function handleBulkImportFile(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let records;
    try {
      records = JSON.parse(reader.result);
      if (!Array.isArray(records)) throw new Error("配列形式ではありません");
    } catch (e) {
      document.getElementById("bulkImportPreview").innerHTML = `<p style="color:var(--danger);">ファイルの読み込みに失敗しました: ${e.message}</p>`;
      return;
    }
    state.bulkImportRecords = records;
    const noPhone = records.filter(r => !r.phone).length;
    document.getElementById("bulkImportPreview").innerHTML = `
      <p style="margin-top:10px;">${records.length}件のデータを読み込みました。${noPhone > 0 ? `（うち電話番号なし: ${noPhone}件）` : ""}</p>
      <button class="primary" onclick="runBulkImport()">この内容で登録する</button>
    `;
  };
  reader.readAsText(file);
}

async function runBulkImport() {
  const records = state.bulkImportRecords || [];
  if (!records.length) return;
  document.getElementById("bulkImportPreview").innerHTML = `<p>登録中です…しばらくお待ちください</p>`;

  if (!firebaseReady) {
    records.forEach(r => state.employees.push({ id: "demo-" + Math.random(), ...r }));
    state.showBulkImport = false;
    state.bulkImportRecords = null;
    alert("（お試し表示のため実際の保存はされません）");
    return render();
  }

  try {
    const batch = db.batch();
    records.forEach(r => {
      const ref = r.loginId ? db.collection("employees").doc(r.loginId) : db.collection("employees").doc();
      batch.set(ref, r, { merge: true });
    });
    await batch.commit();
    state.showBulkImport = false;
    state.bulkImportRecords = null;
    alert(`${records.length}件、登録できました！`);
    render();
  } catch (e) {
    alert("登録エラー: " + e.message);
  }
}

function toWareki(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  let era, ey;
  if (y >= 2019 && !(y === 2019 && (m < 5))) { era = "令和"; ey = y - 2018; }
  else if (y >= 1989) { era = "平成"; ey = y - 1988; }
  else if (y >= 1926) { era = "昭和"; ey = y - 1925; }
  else { return dateStr; }
  if (ey === 1) ey = "元";
  return `${era}　${ey}年　${m}月　${day}日`;
}
// 日付文字列に月／日を足す。iOSでも落ちないよう、堅牢に日付を解釈し、
// 読めない日付のときは空文字を返す（Invalid Date に toISOString して例外で落ちるのを防ぐ）。
// タイムゾーンずれを避けるため、ローカルの年月日から手で組み立てる。
function pad2(n) { return String(n).padStart(2, "0"); }
function formatYmd(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function addMonths(dateStr, months) {
  const base = parseFlexibleDate(dateStr);
  if (!base || isNaN(base)) return "";
  const d = new Date(base.getFullYear(), base.getMonth() + months, base.getDate());
  return isNaN(d) ? "" : formatYmd(d);
}
function addDays(dateStr, days) {
  const base = parseFlexibleDate(dateStr);
  if (!base || isNaN(base)) return "";
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
  return isNaN(d) ? "" : formatYmd(d);
}

/* ---------- 給与明細（PDFアップロード／ダウンロード） ---------- */
function arrayBufferToBase64Pdf(bytes) {
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return "data:application/pdf;base64," + btoa(binary);
}

async function extractPageTexts(file) {
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const texts = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      texts.push(content.items.map(it => it.str).join(" "));
    }
    return texts;
  } catch (e) {
    console.error("PDF文字読み取りエラー", e);
    return [];
  }
}

function guessEmployeeIdFromText(text, employees) {
  if (!text) return "";
  for (const e of employees) {
    if (e.employeeCode && text.includes(e.employeeCode)) return e.id;
  }
  return "";
}

async function handleBulkPayslipFile(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const isOxps = /\.oxps$/i.test(file.name);
  if (isOxps) return handleBulkPayslipOxps(file, evt);
  if (file.type !== "application/pdf") { alert("PDFまたはOXPSファイルを選んでください"); evt.target.value = ""; return; }

  document.getElementById("bulkPayslipArea").innerHTML = `<p class="muted">読み込み中です…（管理番号を自動で読み取っています）しばらくお待ちください</p>`;
  try {
    const pageTexts = await extractPageTexts(file);

    const arrayBuffer = await file.arrayBuffer();
    const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const pageCount = srcDoc.getPageCount();

    const activeSorted = state.employees
      .filter(e => e.status !== "resigned")
      .slice()
      .sort((a, b) => (a.employeeCode || "").localeCompare(b.employeeCode || "", "ja", { numeric: true }));

    const pages = [];
    for (let i = 0; i < pageCount; i++) {
      const newDoc = await PDFLib.PDFDocument.create();
      const [copiedPage] = await newDoc.copyPages(srcDoc, [i]);
      newDoc.addPage(copiedPage);
      const bytes = await newDoc.save();
      const matchedId = guessEmployeeIdFromText(pageTexts[i], state.employees);
      pages.push({
        pageIndex: i,
        base64: arrayBufferToBase64Pdf(bytes),
        sizeKB: Math.round(bytes.length / 1024),
        employeeId: matchedId || (activeSorted[i] && activeSorted[i].id) || "",
        matchedByCode: !!matchedId
      });
    }
    state.bulkPayslipPages = pages;
    document.getElementById("bulkPayslipArea").innerHTML = renderBulkPayslipAssignList();
  } catch (e) {
    document.getElementById("bulkPayslipArea").innerHTML = `<p style="color:var(--danger);">PDFの読み込みに失敗しました: ${e.message}</p>`;
  }
}

/* ========== OXPS（弥生給与の明細出力）対応 ========== */

const PS_KYUYO_LABELS = new Set([
  "基本給", "基本給(日給)", "基本給(時給)", "基本給(月給)",
  "職務給", "役員報酬", "役付手当", "皆勤手当", "出張手当",
  "非課税通勤費", "休日勤務手当"
]);
const PS_KOJO_LABELS = new Set([
  "健康保険料", "厚生年金保険", "雇用保険料", "年末調整還付", "年末調整徴収",
  "(定額減税額)", "(減税前税額)"
]);
const PS_AMBIGUOUS_LABELS = new Set(["前月修正", "立替", "立替金"]);
const PS_ATTEND_LABELS = new Set(["所定", "出勤", "休日", "実働", "有休", "欠勤"]);

function psParseGlyphRuns(xml) {
  const re = /<Glyphs[^>]*OriginX="([\d.]+)"[^>]*OriginY="([\d.]+)"[^>]*Indices="([^"]*)"[^>]*UnicodeString="([^"]*)"/g;
  const runs = [];
  let m;
  while ((m = re.exec(xml)) !== null) {
    runs.push({ x: parseFloat(m[1]), y: parseFloat(m[2]), indices: m[3], text: m[4] });
  }
  return runs;
}

// 結合された数値ラン（例："249,00023,9901,11025,100223,900"）を、
// 弥生のOXPS出力ではフィールドの区切り位置の文字だけIndices内にアドバンス幅の上書き（カンマ区切りの2値目）
// が入っているため、それを目印に分割する。
function psSplitCombinedNumberRun(run) {
  const tokens = run.indices.split(";");
  const text = run.text;
  if (tokens.length !== text.length) return [text];
  const parts = [];
  let cur = "";
  for (let i = 0; i < tokens.length; i++) {
    cur += text[i];
    if (tokens[i].includes(",") && i !== tokens.length - 1) { parts.push(cur); cur = ""; }
  }
  if (cur) parts.push(cur);
  return parts;
}

function psToNumber(s) {
  if (s == null) return 0;
  const n = String(s).replace(/,/g, "").replace(/[△▲]/, "-").trim();
  const v = parseFloat(n);
  return isNaN(v) ? 0 : v;
}

function psWarekiToMonth(str) {
  const m = str.match(/令和\s*(\d+)年\s*(\d+)月分/);
  if (!m) return "";
  const year = 2018 + parseInt(m[1], 10);
  const month = String(parseInt(m[2], 10)).padStart(2, "0");
  return `${year}-${month}`;
}

function psParseOnePage(xml) {
  const allRuns = psParseGlyphRuns(xml);
  // 1ページに「正」「副」の2部（同一内容）が上下に印字されているため、上半分のみを使う
  const runs = allRuns.filter(r => r.y < 558).sort((a, b) => (Math.round(a.y / 5) - Math.round(b.y / 5)) || (a.x - b.x));

  const rec = {
    code: "", name: "", branch: "", month: "",
    attendance: {}, kyuyo: [], kojo: [],
    kyuyoGokei: 0, shakaihokenGokei: 0, shotokuzei: 0, kojoGokei: 0,
    sashihikiShikyu: 0, furikomiShikyu: 0, genkinShikyu: 0
  };

  for (let i = 0; i < runs.length; i++) {
    const r = runs[i];
    const next = runs[i + 1];

    if (r.text === "番号" && next) { rec.code = next.text.trim(); continue; }

    if (r.text.startsWith("氏名") && r.text.includes("令和")) {
      const nameMatch = r.text.match(/^氏名(.+?)殿組織(.*?)令和/);
      if (nameMatch) { rec.name = nameMatch[1]; rec.branch = nameMatch[2] || ""; }
      rec.month = psWarekiToMonth(r.text);
      continue;
    }

    if (PS_ATTEND_LABELS.has(r.text) && next && r.y >= 85 && r.y <= 160) {
      rec.attendance[r.text] = next.text.trim();
      continue;
    }

    if (r.text === "支給合計社会保険料計所得税控除合計") continue;

    if (r.y > 415 && r.y < 435 && /^[\d,]+$/.test(r.text) && r.indices.split(";").length === r.text.length) {
      const parts = psSplitCombinedNumberRun(r);
      if (parts.length === 5) {
        rec.kyuyoGokei = psToNumber(parts[0]);
        rec.shakaihokenGokei = psToNumber(parts[1]);
        rec.shotokuzei = psToNumber(parts[2]);
        rec.kojoGokei = psToNumber(parts[3]);
        rec.sashihikiShikyu = psToNumber(parts[4]);
      }
      continue;
    }

    if (r.y > 465 && r.y < 485 && r.x > 650 && /^[\d,]+$/.test(r.text)) { rec.furikomiShikyu = psToNumber(r.text); continue; }
    if (r.y > 515 && r.y < 530 && r.x > 650 && /^[\d,]+$/.test(r.text)) { rec.genkinShikyu = psToNumber(r.text); continue; }

    if (r.y >= 180 && r.y <= 365 && next &&
        (PS_KYUYO_LABELS.has(r.text) || PS_KOJO_LABELS.has(r.text) || PS_AMBIGUOUS_LABELS.has(r.text))) {
      const amount = psToNumber(next.text);
      if (PS_KYUYO_LABELS.has(r.text) || (PS_AMBIGUOUS_LABELS.has(r.text) && r.x < 430)) {
        rec.kyuyo.push({ label: r.text, amount });
      } else {
        rec.kojo.push({ label: r.text, amount });
      }
      i++;
      continue;
    }
  }
  return rec;
}

function psNaturalSort(a, b) {
  const na = parseInt(a.match(/(\d+)/)[1], 10);
  const nb = parseInt(b.match(/(\d+)/)[1], 10);
  return na - nb;
}

async function handleBulkPayslipOxps(file, evt) {
  document.getElementById("bulkPayslipArea").innerHTML = `<p class="muted">読み込み中です…（OXPSファイルを解析し、金額を読み取っています）しばらくお待ちください</p>`;
  try {
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pageFiles = Object.keys(zip.files)
      .filter(p => /^Documents\/1\/Pages\/\d+\.fpage$/.test(p))
      .sort(psNaturalSort);
    if (!pageFiles.length) throw new Error("ページが見つかりませんでした（OXPSの形式をご確認ください）");

    const records = [];
    for (const pf of pageFiles) {
      const xml = await zip.file(pf).async("string");
      const rec = psParseOnePage(xml);
      records.push(rec);
    }

    // 従業員マッチング（管理番号優先、見つからなければ氏名）
    records.forEach(rec => {
      let emp = state.employees.find(e => e.employeeCode && e.employeeCode === rec.code);
      if (!emp) emp = state.employees.find(e => e.name && e.name === rec.name);
      rec.employeeId = emp ? emp.id : "";
      rec.matched = !!emp;
      rec.noWorkplace = emp ? !emp.workplace : false;
      // 検算：弥生自身が計算した合計欄どうしの整合性のみを確認する
      // （支給・控除の内訳項目は弥生台紙表示用であり、内訳の合算とは一致しないことがあるため検算には使わない）
      rec.reconcileOk =
        (rec.kyuyoGokei - rec.kojoGokei) === rec.sashihikiShikyu &&
        (rec.furikomiShikyu + rec.genkinShikyu) === rec.sashihikiShikyu;
    });

    state.bulkOxpsRecords = records;
    state.bulkOxpsMonth = records[0] && records[0].month || state.payslipMonth || new Date().toISOString().slice(0, 7);
    document.getElementById("bulkPayslipArea").innerHTML = renderBulkOxpsReview();
  } catch (e) {
    document.getElementById("bulkPayslipArea").innerHTML = `<p style="color:var(--danger);">OXPSの読み込みに失敗しました: ${e.message}</p>`;
  } finally {
    if (evt) evt.target.value = "";
  }
}

function renderBulkOxpsReview() {
  const records = state.bulkOxpsRecords || [];
  if (!records.length) return "";
  const ngCount = records.filter(r => !r.reconcileOk).length;
  const noWorkplaceCount = records.filter(r => r.noWorkplace).length;
  const unmatchedCount = records.filter(r => !r.matched).length;
  const totalSashihiki = records.reduce((s, r) => s + r.sashihikiShikyu, 0);
  const month = state.bulkOxpsMonth;

  return `
    <div style="margin-top:14px;">
      <div class="responsive-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;">
        <div class="stat-card"><div class="num">${records.length}名</div><div class="label">読み取り</div></div>
        <div class="stat-card"><div class="num" style="color:${ngCount ? 'var(--danger)' : 'inherit'};">${ngCount}名</div><div class="label">検算NG</div></div>
        <div class="stat-card"><div class="num">${noWorkplaceCount}名</div><div class="label">所属未設定</div></div>
        <div class="stat-card"><div class="num" style="font-size:16px;">${totalSashihiki.toLocaleString()}円</div><div class="label">差引支給額 総計</div></div>
      </div>
      ${unmatchedCount ? `<div class="payslip-warning">従業員に一致しなかった方が${unmatchedCount}名います。お試しモードのため従業員データが少ないと、この件数が多く出ます（実際のFirebase環境では管理番号でご登録の従業員と自動照合されます）。下の一覧から手動で割り当てることもできます。</div>` : ""}
      ${ngCount ? `<div class="payslip-warning">検算に一致しない明細が${ngCount}名分あります。金額が正しく読み取れていない可能性があるため、対象月を確認し、必要であれば元のOXPSファイルをご確認ください。</div>` : ""}
      <p class="muted" style="margin:0 0 8px;">対象月：
        <select onchange="state.bulkOxpsMonth=this.value;">
          ${[state.bulkOxpsMonth].concat(records.map(r=>r.month)).filter((v,i,a)=>v && a.indexOf(v)===i).map(m => `<option value="${m}" ${m===month?"selected":""}>${m}</option>`).join("")}
        </select>
      </p>
      <table>
        <thead><tr><th>管理番号</th><th>氏名</th><th>組織</th><th>差引支給額</th><th>状態</th><th>割り当てる従業員</th><th></th></tr></thead>
        <tbody>
          ${records.map((r, i) => `
            <tr>
              <td>${r.code}</td>
              <td>${r.name}</td>
              <td>${r.branch || `<span class="muted">未設定</span>`}</td>
              <td style="text-align:right;">${r.sashihikiShikyu.toLocaleString()}円</td>
              <td>
                ${r.matched ? `<span class="status-pill status-approved">一致</span>` : `<span class="status-pill status-pending">未一致</span>`}
                ${r.reconcileOk ? "" : `<span class="status-pill" style="background:#FEE2E2;color:var(--danger);">検算NG</span>`}
              </td>
              <td>
                <select onchange="state.bulkOxpsRecords[${i}].employeeId=this.value; state.bulkOxpsRecords[${i}].matched=!!this.value;">
                  <option value="">選ばない</option>
                  ${state.employees.map(e => `<option value="${e.id}" ${e.id === r.employeeId ? "selected" : ""}>${e.name || e.id}${e.employeeCode ? "（" + e.employeeCode + "）" : ""}</option>`).join("")}
                </select>
              </td>
              <td><button style="font-size:12px; padding:6px 10px;" onclick="previewOxpsRecord(${i})">見る</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      <button class="primary" style="margin-top:12px;" onclick="registerBulkOxpsPayslips()">この内容でまとめて登録する（配信する）</button>
    </div>
    <div id="oxpsPreviewModal"></div>
  `;
}

function previewOxpsRecord(i) {
  const r = (state.bulkOxpsRecords || [])[i];
  if (!r) return;
  document.getElementById("oxpsPreviewModal").innerHTML = `
    <div class="modal-overlay" onclick="document.getElementById('oxpsPreviewModal').innerHTML=''">

        <div class="row-between" style="margin-bottom:10px;">

async function registerBulkOxpsPayslips() {
  const records = state.bulkOxpsRecords || [];
  const month = state.bulkOxpsMonth;
  if (!month) return alert("対象月を選んでください");
  const targets = records.filter(r => r.employeeId);
  if (!targets.length) return alert("登録できる明細がありません（従業員の割り当てをご確認ください）");

  if (!firebaseReady) {
    state.payslips = state.payslips || [];
    targets.forEach(r => {
      const emp = state.employees.find(e => e.id === r.employeeId) || {};
      const docId = r.employeeId + "_" + month;
      const data = { id: docId, employeeId: r.employeeId, employeeName: emp.name || r.name, month, fileName: `給与明細_${month}.pdf`, source: "oxps", data: r };
      const idx = state.payslips.findIndex(x => x.id === docId);
      if (idx >= 0) state.payslips[idx] = data; else state.payslips.push(data);
    });
    state.bulkOxpsRecords = null;
    alert(`${targets.length}件、登録しました（お試し表示のため実際の保存はされません）`);
    return render();
  }

  try {
    const batch = db.batch();
    targets.forEach(r => {
      const emp = state.employees.find(e => e.id === r.employeeId) || {};
      const docId = r.employeeId + "_" + month;
      const ref = db.collection("payslips").doc(docId);
      batch.set(ref, {
        employeeId: r.employeeId,
        employeeName: emp.name || r.name,
        month,
        fileName: `給与明細_${month}.pdf`,
        source: "oxps",
        data: r,
        uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    state.bulkOxpsRecords = null;
    alert(`${targets.length}件、登録しました`);
    render();
  } catch (e) {
    alert("登録エラー: " + e.message);
  }
}

  try {
    const batch = db.batch();
    targets.forEach(p => {
      const emp = state.employees.find(e => e.id === p.employeeId) || {};
      const docId = p.employeeId + "_" + month;
      const ref = db.collection("payslips").doc(docId);
      batch.set(ref, {
        employeeId: p.employeeId,
        employeeName: emp.name || "",
        month,
        fileName: `給与明細_${month}.pdf`,
        pdfBase64: p.base64,
        uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    state.bulkPayslipPages = null;
    alert(`${targets.length}件、登録しました`);
    render();
  } catch (e) {
    alert("登録エラー: " + e.message);
  }
}

/* 給与明細：36か月より古いものは表示せず、管理者側で自動的に削除する */
function payslipCutoffMonth() {
  const d = new Date();
  d.setMonth(d.getMonth() - 36);
  return d.toISOString().slice(0, 7); // "YYYY-MM"
}
function filterRecentPayslips(list) {
  const cutoff = payslipCutoffMonth();
  return (list || []).filter(p => !p.month || p.month >= cutoff);
}
async function cleanupOldPayslips(allPayslips) {
  if (!firebaseReady) return;
  const cutoff = payslipCutoffMonth();
  const old = (allPayslips || []).filter(p => p.month && p.month < cutoff);
  if (!old.length) return;
  try {
    const batch = db.batch();
    old.forEach(p => batch.delete(db.collection("payslips").doc(p.id)));
    await batch.commit();
    console.log(`36か月より古い給与明細を${old.length}件、自動削除しました`);
  } catch (e) {
    console.error("古い給与明細の自動削除エラー", e);
  }
}

function handlePayslipFileSelect(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  if (file.type !== "application/pdf") {
    alert("PDFファイルを選んでください");
    evt.target.value = "";
    return;
  }
  if (file.size > 650 * 1024) {
    alert("ファイルが大きすぎます（650KBまで）。弥生給与の出力設定で、白黒・低解像度などにして小さくしてから再度お試しください。");
    evt.target.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    state.pendingPayslip = { base64: reader.result, fileName: file.name };
    document.getElementById("payslipUploadPreview").innerHTML = `
      <p style="margin-top:10px;">「${file.name}」を読み込みました。</p>
      <button class="primary" onclick="uploadPayslip()">この内容でアップロードする</button>
    `;
  };
  reader.readAsDataURL(file);
}

async function uploadPayslip() {
  const empId = state.payslipEmpId || (state.employees[0] && state.employees[0].id);
  const emp = state.employees.find(e => e.id === empId) || {};
  const month = (document.getElementById("payslipMonth") || {}).value || state.payslipMonth;
  if (!empId || !month || !state.pendingPayslip) return alert("従業員・対象月・ファイルをご確認ください");

  const data = {
    employeeId: empId,
    employeeName: emp.name || "",
    month,
    fileName: state.pendingPayslip.fileName,
    pdfBase64: state.pendingPayslip.base64,
    uploadedAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
  };
  const docId = empId + "_" + month;

  if (!firebaseReady) {
    state.payslips = state.payslips || [];
    const idx = state.payslips.findIndex(p => p.id === docId);
    if (idx >= 0) state.payslips[idx] = { id: docId, ...data };
    else state.payslips.push({ id: docId, ...data });
    state.pendingPayslip = null;
    alert("（お試し表示のため実際の保存はされません）");
    return render();
  }
  try {
    await db.collection("payslips").doc(docId).set(data);
    state.pendingPayslip = null;
    alert("アップロードしました");
    render();
  } catch (e) {
    alert("アップロードエラー: " + e.message);
  }
}

async function deletePayslip(id) {
  if (!confirm("この給与明細を削除します。よろしいですか？")) return;
  if (!firebaseReady) {
    state.payslips = (state.payslips || []).filter(p => p.id !== id);
    return render();
  }
  try {
    await db.collection("payslips").doc(id).delete();
  } catch (e) {
    alert("削除エラー: " + e.message);
  }
}

/* PDF保存（iOSの印刷機能を経由しないため、印刷時のURL帯が付かない） */
async function savePreviewAsPdf(elementId, filename, btnEl) {
  const el = document.getElementById(elementId);
  if (!el) return alert("保存する内容が見つかりません");
  const originalLabel = btnEl ? btnEl.textContent : "";
  if (btnEl) { btnEl.textContent = "PDFを作成中…"; btnEl.disabled = true; }
  // 画面表示用の「カード」の余白・角丸・枠線は、印刷物としては不要なので、
  // キャプチャの間だけ一時的に外す（印刷時のCSSと同じ見た目に揃えるため）
  const prevStyle = { padding: el.style.padding, border: el.style.border, borderRadius: el.style.borderRadius, boxShadow: el.style.boxShadow, margin: el.style.margin };
  el.style.padding = "0";
  el.style.border = "none";
  el.style.borderRadius = "0";
  el.style.boxShadow = "none";
  el.style.margin = "0";

  // 労働者名簿は1枚に収まる短い書類なので、印刷時と同じく文字・余白を大きくする
  const isRoster = el.classList.contains("roster-print");
  const restoreFns = [];
  const bumpStyle = (node, prop, value) => {
    const prev = node.style[prop];
    node.style[prop] = value;
    restoreFns.push(() => { node.style[prop] = prev; });
  };
  if (isRoster) {
    bumpStyle(el, "fontSize", "16px");
    el.querySelectorAll("td").forEach(td => bumpStyle(td, "padding", "14px 18px"));
    el.querySelectorAll(".rm-flex-pad").forEach(d => bumpStyle(d, "padding", "14px 18px"));
    const title = el.querySelector("p:first-child");
    if (title) { bumpStyle(title, "fontSize", "26px"); bumpStyle(title, "marginBottom", "28px"); bumpStyle(title, "letterSpacing", "14px"); }
    const footer = el.querySelector(".rm-footer");
    if (footer) bumpStyle(footer, "fontSize", "15px");
  }
  // 印刷したときに罫線や薄い背景色が飛んでしまわないよう、キャプチャ時は濃くしておく
  if (el.classList.contains("contract-preview")) {
    el.querySelectorAll("table, td").forEach(node => { bumpStyle(node, "borderColor", "#4A4238"); bumpStyle(node, "borderWidth", "1.5px"); });
    el.querySelectorAll(".c-label, .rm-flex-pad:first-child").forEach(node => bumpStyle(node, "background", "#E4CFA0"));
    el.querySelectorAll("td, p").forEach(node => { bumpStyle(node, "color", "#1a1613"); });
  }

  try {
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const pageW = 595.28, pageH = 841.89; // A4（pt）
    const pageAspect = pageH / pageW;
    const pxPerPage = Math.floor(canvas.width * pageAspect);
    const totalPages = Math.max(1, Math.ceil(canvas.height / pxPerPage));

    const pdfDoc = await PDFLib.PDFDocument.create();
    let y = 0;
    while (y < canvas.height) {
      const sliceH = Math.min(pxPerPage, canvas.height - y);
      const sliceCanvas = document.createElement("canvas");
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceH;
      const ctx = sliceCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, sliceH);
      ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      const imgData = sliceCanvas.toDataURL("image/png");
      const imgBytes = Uint8Array.from(atob(imgData.split(",")[1]), c => c.charCodeAt(0));
      const png = await pdfDoc.embedPng(imgBytes);
      const page = pdfDoc.addPage([pageW, pageH]);
      const drawH = pageW * (sliceH / canvas.width);
      // 1枚に収まる短い書類（労働者名簿など）は、上に詰めず縦方向の中央に配置する
      const yPos = totalPages === 1 ? (pageH - drawH) / 2 : pageH - drawH;
      page.drawImage(png, { x: 0, y: yPos, width: pageW, height: drawH });
      y += sliceH;
    }
    const bytes = await pdfDoc.save();
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    alert("PDFの作成に失敗しました: " + e.message);
  } finally {
    el.style.padding = prevStyle.padding;
    el.style.border = prevStyle.border;
    el.style.borderRadius = prevStyle.borderRadius;
    el.style.boxShadow = prevStyle.boxShadow;
    el.style.margin = prevStyle.margin;
    restoreFns.forEach(fn => fn());
    if (btnEl) { btnEl.textContent = originalLabel; btnEl.disabled = false; }
  }
}

/* ===== この方の書類（従業員ごと・本社のみ閲覧） =====
   既存の診断書(medicalCertificates)と、新しく足す書類(employeeDocs)を1つの画面にまとめて表示する。
   ファイル本体は給与明細と同じく base64 のデータURIとして Firestore に保存する（Storageは使わない）。 */

let empDocsUnsub1 = null; // medicalCertificates の購読解除用
let empDocsUnsub2 = null; // employeeDocs の購読解除用

// 開いている従業員の書類を購読する（別の従業員に切り替えたら前の購読は解除する）
function subscribeEmployeeDocs(empId) {
  if (empDocsUnsub1) { try { empDocsUnsub1(); } catch (e) {} empDocsUnsub1 = null; }
  if (empDocsUnsub2) { try { empDocsUnsub2(); } catch (e) {} empDocsUnsub2 = null; }
  state.empMedCerts = [];
  state.empEmployeeDocs = [];
  state.empDocsLoadedFor = empId;
  if (!firebaseReady || !empId) return;
  empDocsUnsub1 = db.collection("medicalCertificates").where("employeeId", "==", empId)
    .onSnapshot(snap => { state.empMedCerts = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
      err => console.error("診断書(medicalCertificates)購読エラー", err));
  empDocsUnsub2 = db.collection("employeeDocs").where("employeeId", "==", empId)

// 診断書(medicalCertificates)と書類(employeeDocs)を、共通の形にそろえて新しい順にまとめる
function employeeDocList() {
  const med = (state.empMedCerts || []).map(d => ({
    id: d.id, source: "medicalCertificates",
    category: "診断書",
    date: d.certDate || "",
    fileName: d.fileName || "",
    note: d.note || "",
    dataUri: d.pdfBase64 || "",
    uploadedAt: d.uploadedAt
  }));
  const other = (state.empEmployeeDocs || []).map(d => ({
    id: d.id, source: "employeeDocs",
    category: d.category || "その他",
    date: d.docDate || "",
    fileName: d.fileName || "",
    note: d.note || "",
    dataUri: d.fileBase64 || "",
    uploadedAt: d.uploadedAt
  }));
  return med.concat(other).sort((a, b) => {
    const da = a.date || "", dbb = b.date || "";
    if (da && dbb && da !== dbb) return da < dbb ? 1 : -1; // 日付の新しい順
    return tsSeconds(b.uploadedAt) - tsSeconds(a.uploadedAt);
  });
}

// データURI（data:...;base64,...）をBlobに変換する（大きいファイルでも確実に開ける・保存できるように）
function dataUriToBlob(dataUri) {
  const comma = dataUri.indexOf(",");
  const meta = dataUri.slice(0, comma);
  const b64 = dataUri.slice(comma + 1);
  const mime = (meta.match(/data:(.*?);base64/) || [])[1] || "application/octet-stream";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function viewEmployeeDoc(source, id) {
  const d = employeeDocList().find(x => x.source === source && x.id === id);
  if (!d || !d.dataUri) return alert("この書類を開けませんでした");
  try {
    const url = URL.createObjectURL(dataUriToBlob(d.dataUri));
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    window.open(d.dataUri, "_blank");
  }
}

function downloadEmployeeDoc(source, id) {
  const d = employeeDocList().find(x => x.source === source && x.id === id);
  if (!d || !d.dataUri) return alert("この書類を保存できませんでした");
  const name = d.fileName || (d.category + ".pdf");
  try {
    const url = URL.createObjectURL(dataUriToBlob(d.dataUri));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    window.open(d.dataUri, "_blank");
  }
}

// PDF/画像を base64 化して employeeDocs に保存する
async function addEmployeeDoc(empId) {
  const emp = state.employees.find(e => e.id === empId);
  if (!emp) return;
  const fileInput = document.getElementById("empDocFile");
  const file = fileInput && fileInput.files && fileInput.files[0];
  let category = state.empDocCategory || "診断書";
  if (category === "その他") category = (state.empDocCategoryOther || "").trim() || "その他";
  const docDate = ((document.getElementById("empDocDate") || {}).value) || state.empDocDate || "";
  const note = (((document.getElementById("empDocNote") || {}).value) || "").trim();

  if (!file) return alert("ファイルを選んでください");
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  const isImg = /^image\//.test(file.type);
  if (!isPdf && !isImg) return alert("PDFまたは画像ファイルを選んでください");

  state.empDocUploading = true;
  render();
  try {
    let dataUri, mimeType;
    if (isImg) {
      dataUri = await compressImageToBase64(file, 1400, 0.7); // 画像は圧縮
      mimeType = "image/jpeg";
    } else {
      dataUri = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error("ファイルの読み込みに失敗しました"));
        r.readAsDataURL(file);
      });
      mimeType = "application/pdf";
    }
    if (!dataUri || dataUri.length > 950000) {
      state.empDocUploading = false;
      render();
      return alert("ファイルが大きすぎて保存できません（およそ900KBまで）。スキャンを白黒・低解像度にする、ページを分けるなどして小さくしてから、もう一度お試しください。");
    }
    const data = {
      employeeId: empId,
      employeeName: emp.name || "",
      category,
      docDate,
      fileName: file.name || (category + (isImg ? ".jpg" : ".pdf")),
      note,
      fileBase64: dataUri,
      mimeType,
      uploadedAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
    };
    if (!firebaseReady) {
      state.empEmployeeDocs = state.empEmployeeDocs || [];
      state.empEmployeeDocs.unshift({ id: "demo-" + Date.now(), ...data });
      state.empDocUploading = false;
      resetEmpDocForm();
      if (fileInput) fileInput.value = "";
      render();
      return;
    }
    await db.collection("employeeDocs").add(data);
    state.empDocUploading = false;
    resetEmpDocForm();
    if (fileInput) fileInput.value = "";
    render();
    alert("書類を保存しました。");
  } catch (e) {
    state.empDocUploading = false;
    render();
    alert("保存できませんでした: " + (e && e.message ? e.message : e));
  }
}

async function deleteEmployeeDoc(source, id) {
  const d = employeeDocList().find(x => x.source === source && x.id === id);
  if (!d) return;
  const label = `${d.category}${d.date ? "／" + d.date : ""}`;
  const extra = source === "medicalCertificates" ? "\n（以前に保存された診断書です）" : "";
  if (!confirm(`「${label}」を削除します。元に戻せません。よろしいですか？${extra}`)) return;
  try {
    await db.collection(source).doc(id).delete();
    render();
  } catch (e) {
    alert("削除できませんでした: " + (e && e.message ? e.message : e));
  }
}

/* ---------- 封筒印刷の設定を保存する（本社共有・次回から自動で同じ位置に印刷） ---------- */
const ENVELOPE_SETTINGS_LOCAL_KEY = "assistRoumuEnvelopeSettings";

function subscribeEnvelopeSettings() {
  if (!firebaseReady) {
    try {
      const raw = localStorage.getItem(ENVELOPE_SETTINGS_LOCAL_KEY);
      if (raw) applyEnvelopeSettings(JSON.parse(raw));
    } catch (e) { /* 読み込めない場合は初期値のまま */ }
    return;
  }
  db.collection("settings").doc("envelope").onSnapshot(doc => {
    if (doc.exists) applyEnvelopeSettings(doc.data());
  }, err => console.error("封筒設定の読み込みエラー", err));
}

function applyEnvelopeSettings(d) {
  if (!d) return;
  if (d.envelopeOffset) state.envelopeOffset = d.envelopeOffset;
  if (d.envelopeOffsetH) state.envelopeOffsetH = d.envelopeOffsetH;
  if (d.envelopeShowBoxes != null) state.envelopeShowBoxes = d.envelopeShowBoxes;
  if (d.envelopeMode) state.envelopeMode = d.envelopeMode;
  // 封筒印刷タブを表示中は、画面全体(＝「位置の微調整」パネルを含む)を作り直さない。
  // プレビューの絵だけを更新することで、パネルが開いたまま数値調整を続けられるようにする。
  if (state.adminTab === "envelope") refreshEnvelopeSheet();
}

function saveEnvelopeSettings() {
  const data = {
    envelopeOffset: state.envelopeOffset,
    envelopeOffsetH: state.envelopeOffsetH,
    envelopeShowBoxes: !!state.envelopeShowBoxes,
    envelopeMode: state.envelopeMode || "vertical"
  };
  if (!firebaseReady) {
    try { localStorage.setItem(ENVELOPE_SETTINGS_LOCAL_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
    return;
  }
  db.collection("settings").doc("envelope").set(data, { merge: true })
    .catch(e => console.error("封筒設定の保存エラー", e));
}
